<main class="landing-shell">
  <section class="redirect-card" aria-live="polite">
    <img [src]="logoUrl" alt="Operativuz" class="brand-logo" />

    <p class="eyebrow">Arrendar em Luanda</p>

    <h1>Estamos a encaminhar-te para o WhatsApp da Operativuz.</h1>

    <p class="lead">
      Escolhes a casa, marcamos a visita e ajudamos a fechar o contrato sem complicações.
    </p>

    <div class="actions">
      <a
        class="primary-action"
        [href]="whatsappUrl"
        target="_blank"
        rel="noopener noreferrer"
      >
        Continuar para o WhatsApp
      </a>

      <button type="button" class="secondary-action" (click)="redirectToWhatsapp()">
        Redirecionar agora
      </button>
    </div>

    <p class="contact-line">+244 951 074 711 • Shopping Nosso Centro • Gamek</p>
  </section>
</main>
