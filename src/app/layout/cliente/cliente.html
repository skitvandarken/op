<section class="cliente-form-card">
  <div class="header">
    <h2>Cadastrar cliente</h2>
  </div>

  <form [formGroup]="clienteForm" (ngSubmit)="onSubmit()">
    <div class="grid">
      <label>
        <span>Nome *</span>
        <input type="text" formControlName="nome" />
        <small class="error-text" *ngIf="showError('nome') as error">{{ error }}</small>
      </label>

      <label>
        <span>Email *</span>
        <input type="email" formControlName="email" />
        <small class="error-text" *ngIf="showError('email') as error">{{ error }}</small>
      </label>

      <label>
        <span>Telefone *</span>
        <input type="tel" formControlName="telefone" />
        <small class="error-text" *ngIf="showError('telefone') as error">{{ error }}</small>
      </label>

      <label>
        <span>Tipo</span>
        <select formControlName="tipo">
          <option value="Recorrente">Recorrente</option>
          <option value="Pontual">Pontual</option>
        </select>
      </label>

      <label>
        <span>Cidade *</span>
        <input type="text" formControlName="cidade" />
        <small class="error-text" *ngIf="showError('cidade') as error">{{ error }}</small>
      </label>

      <label>
        <span>Bairro *</span>
        <input type="text" formControlName="bairro" />
        <small class="error-text" *ngIf="showError('bairro') as error">{{ error }}</small>
      </label>

      <label class="full-width">
        <span>Rua *</span>
        <input type="text" formControlName="rua" />
        <small class="error-text" *ngIf="showError('rua') as error">{{ error }}</small>
      </label>

      <label class="full-width">
        <span>Observações</span>
        <textarea rows="3" formControlName="observacoes"></textarea>
        <small class="error-text" *ngIf="showError('observacoes') as error">{{ error }}</small>
      </label>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="clienteForm.invalid || isSubmitting()">
        {{ isSubmitting() ? 'Salvando...' : 'Salvar cliente' }}
      </button>
    </div>

    <p class="success" *ngIf="successMessage()">
      {{ successMessage() }}
    </p>
  </form>
</section>
