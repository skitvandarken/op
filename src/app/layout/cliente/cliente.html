<section class="cliente-form-card">
  <div class="header">
    <h2>Cadastrar cliente</h2>
  </div>

  <form [formGroup]="clienteForm" (ngSubmit)="onSubmit()">
    <div class="grid">
      <label>
        <span>Nome *</span>
        <input type="text" formControlName="nome" />
        @if (showError('nome'); as error) {
          <small class="error-text">{{ error }}</small>
        }
      </label>

      <label>
        <span>Email *</span>
        <input type="email" formControlName="email" />
        @if (showError('email'); as error) {
          <small class="error-text">{{ error }}</small>
        }
      </label>

      <label>
        <span>Telefone *</span>
        <input type="tel" formControlName="telefone" />
        @if (showError('telefone'); as error) {
          <small class="error-text">{{ error }}</small>
        }
      </label>

      <label>
        <span>Tipo</span>
        <select formControlName="tipo">
          <option value="Recorrente">Recorrente</option>
          <option value="Pontual">Pontual</option>
        </select>
      </label>

      <label>
        <span>Cidade *</span>
        <input type="text" formControlName="cidade" />
        @if (showError('cidade'); as error) {
          <small class="error-text">{{ error }}</small>
        }
      </label>

      <label>
        <span>Bairro *</span>
        <input type="text" formControlName="bairro" />
        @if (showError('bairro'); as error) {
          <small class="error-text">{{ error }}</small>
        }
      </label>

      <label class="full-width">
        <span>Rua *</span>
        <input type="text" formControlName="rua" />
        @if (showError('rua'); as error) {
          <small class="error-text">{{ error }}</small>
        }
      </label>

      <label class="full-width">
        <span>Observações</span>
        <textarea rows="3" formControlName="observacoes"></textarea>
        @if (showError('observacoes'); as error) {
          <small class="error-text">{{ error }}</small>
        }
      </label>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="clienteForm.invalid || isSubmitting()">
        {{ isSubmitting() ? 'Salvando...' : 'Salvar cliente' }}
      </button>
    </div>

    @if (successMessage()) {
      <p class="success">
        {{ successMessage() }}
      </p>
    }
  </form>
</section>
